server:
  # PaaS platforms (Render etc.) inject PORT; local/Docker default stays 8080
  port: ${PORT:8080}

spring:
  application:
    name: tech-sovereignty
  cache:
    type: caffeine
    cache-names: graph, stats
    caffeine:
      spec: expireAfterWrite=30s,maximumSize=32

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    neo4j:
      # CognoDB is openCypher-compatible but doesn't ship Neo4j's dbms.components
      # procedure, so Spring's stock indicator reports DOWN. /api/health is the real probe.
      enabled: false

cognodb:
  # defaults exist so the API still boots (and reports "unreachable") without a configured instance
  uri: ${COGNODB_URI:bolt+s://not-configured.databases.cognodb.cloud}
  user: ${COGNODB_USER:cognodb}
  password: ${COGNODB_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

breaker:
  failure-threshold: 3
  cooldown-millis: 15000
