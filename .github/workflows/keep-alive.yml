name: keep-alive

# Render's free tier spins the API down after 15 idle minutes. This workflow
# pings from GitHub's cloud every 5 minutes so the instance never idles —
# independent of anyone's PC being on. Each ping runs a real DB probe, so it
# keeps the CognoDB free instance awake too. Free on public repos.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 75 \
            https://tech-sovereignty-api.onrender.com/api/health)
          echo "health: $code"
          # a red run here means the API failed to answer — check the service
          [ "$code" = "200" ] || exit 1
