# Render blueprint — provisions the API as a free-tier Java web service.
# Set COGNODB_URI / COGNODB_USER / COGNODB_PASSWORD in the Render dashboard,
# and point CORS_ORIGINS at the deployed frontend origin.
services:
  - type: web
    name: tech-sovereignty-api
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/sovereignty-1.0.0.jar
    healthCheckPath: /api/health
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JAVA_VERSION
        value: 17
