# Render blueprint — provisions the API as a free-tier Docker web service.
# Set COGNODB_URI / COGNODB_USER / COGNODB_PASSWORD in the Render dashboard,
# and point CORS_ORIGINS at the deployed frontend origin.
services:
  - type: web
    name: tech-sovereignty-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # cold-start hardening: lazy beans + C1-only JIT cut wake-up roughly in half
      # (overrides the Dockerfile's JAVA_TOOL_OPTIONS with the full set)
      - key: LAZY_INIT
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
