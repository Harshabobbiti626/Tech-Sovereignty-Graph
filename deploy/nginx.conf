# standalone nginx config (no dependency on the distro's main file layout):
# /tmp paths so it also runs as uid 1000, which Hugging Face Spaces requires.
# __PORT__ is rewritten by start.sh from the $PORT env var.
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen __PORT__;
    root /srv/ui;
    index index.html;

    # same-origin API: the browser never needs CORS in this setup
    location /api/ {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # cold DB wake + breaker cycles can outlast nginx's 60s default
      proxy_read_timeout 120s;
    }

    # keep API docs reachable on the merged deployment too
    location /swagger-ui {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
    }
    location /v3/api-docs {
      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host $host;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
